appId: co.sumit.harbor
name: Fresh install authentication choices
tags:
  - e2e
  - auth
---
- retry:
    maxRetries: 1
    commands:
      - launchApp:
          clearState: true
          permissions:
            all: allow
      - extendedWaitUntil:
          visible: "(?s)^(?:Connect to Jellyfin|Wait).*"
          timeout: 30000
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible: "Connect to Jellyfin"
          timeout: 30000
- assertVisible: "Connect to Jellyfin"
- tapOn: "Connect to Jellyfin"
- extendedWaitUntil:
    visible: "Add Jellyfin server"
    timeout: 10000
- assertVisible: "(?s)Server URLs.*"
- assertVisible: "Find server"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Back"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard:
          optional: true
      - back
- assertVisible: "Connect to Jellyfin"
